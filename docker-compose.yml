services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surshongi-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
    ports:
      - "${APP_PORT:-3000}:3000"
